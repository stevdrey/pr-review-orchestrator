spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 2000
  jdbc:
    template:
      query-timeout: 2s
  flyway:
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

management:
  endpoint:
    health:
      show-details: never
